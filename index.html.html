<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syarifah Salwa | Portofolio Personal</title>
    <!-- Font Family Poppins & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            bg: '#EAF4F4',
                            card: '#FFFFFF',
                            accent: '#A3E4D7',
                            softBlue: '#D4E6F1',
                            mint: '#A2E8DD',
                            pink: '#FADBD8',
                            darkBg: '#1E293B',
                            darkCard: '#334155',
                            textDark: '#2C3E50',
                            textLight: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        cute: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .scrapbook-shadow {
            box-shadow: 6px 6px 0px 0px rgba(162, 232, 221, 0.4);
        }
        .polaroid-frame {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }
        .polaroid-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }
        .sticker-badge {
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .sticker-badge:hover {
            transform: translateY(-3px) rotate(2deg);
        }
    </style>
</head>
<body class="bg-[#EAF4F4] dark:bg-pastel-darkBg text-pastel-textDark dark:text-pastel-textLight min-h-screen relative overflow-x-hidden">

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-24 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-in-out bg-white dark:bg-pastel-darkCard border-2 border-pastel-mint px-5 py-4 rounded-2xl shadow-xl flex items-center space-x-3">
        <div class="bg-pastel-mint p-2 rounded-full text-white">
            <i data-lucide="check-circle"></i>
        </div>
        <div>
            <h4 class="font-bold text-sm">Pesan Terkirim!</h4>
            <p class="text-xs text-gray-500 dark:text-gray-300">Terima kasih telah menghubungi Syarifah Salwa.</p>
        </div>
    </div>

    <!-- HEADER & NAVBAR -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/70 dark:bg-pastel-darkBg/70 border-b border-gray-100 dark:border-gray-700 transition-all">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Brand Logo -->
            <a href="#" class="font-cute font-bold text-2xl tracking-wider flex items-center gap-2 text-teal-700 dark:text-pastel-accent">
                <span>🐾 Syarifah Salwa</span>
            </a>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex items-center space-x-8 font-medium text-sm">
                <a href="#home" class="hover:text-teal-600 dark:hover:text-pastel-accent transition">Home</a>
                <a href="#about" class="hover:text-teal-600 dark:hover:text-pastel-accent transition">About</a>
                <a href="#experience" class="hover:text-teal-600 dark:hover:text-pastel-accent transition">Experience</a>
                <a href="#education" class="hover:text-teal-600 dark:hover:text-pastel-accent transition">Education</a>
                <a href="#skills" class="hover:text-teal-600 dark:hover:text-pastel-accent transition">Skills</a>
                <a href="#contact" class="hover:text-teal-600 dark:hover:text-pastel-accent transition">Contact</a>
            </nav>

            <!-- Actions (Theme Toggle & Mobile Menu) -->
            <div class="flex items-center space-x-4">
                <button id="themeToggle" class="p-2.5 rounded-2xl bg-white dark:bg-pastel-darkCard shadow-sm border border-gray-100 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:scale-105 transition">
                    <i data-lucide="sun" class="hidden dark:block w-5 h-5"></i>
                    <i data-lucide="moon" class="block dark:hidden w-5 h-5"></i>
                </button>

                <button id="menuBtn" class="md:hidden p-2 rounded-xl bg-white dark:bg-pastel-darkCard border border-gray-100 dark:border-gray-700">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div id="mobileMenu" class="hidden md
